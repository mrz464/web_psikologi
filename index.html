<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Read Daily - Media Pendukung Regulasi Diri Membaca Siswa SMA/SMK</title>
  
  <!-- Font Plus Jakarta Sans & Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- Main Style Sheets -->
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/components.css">
</head>
<body>

  <div class="app-container" id="app-container">
    <!-- Sidebar Navigation Sesuai Mockup Gambar 3.2 & Struktur Bab 3.4.2 -->
    <aside class="app-sidebar" id="app-sidebar">
      <div class="sidebar-header">
        <a href="#beranda" class="app-logo" onclick="window.app.navigate('beranda'); return false;">
          <div class="app-logo-icon">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/>
              <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/>
            </svg>
          </div>
          <span>Read Daily</span>
        </a>
      </div>

      <nav class="sidebar-nav">
        <div class="nav-section-title">Menu Utama</div>

        <a class="nav-item active" data-view="beranda" onclick="window.app.navigate('beranda')">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
            <path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
            <polyline points="9 22 9 12 15 12 15 22"/>
          </svg>
          <span>Beranda</span>
        </a>

        <a class="nav-item" data-view="rencana" onclick="window.app.navigate('rencana')">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
            <circle cx="12" cy="12" r="10"/>
            <polyline points="12 6 12 12 16 14"/>
          </svg>
          <span>Rencana Membaca</span>
        </a>

        <a class="nav-item" data-view="catatan" onclick="window.app.navigate('catatan')">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
            <path d="M12 20h9"/>
            <path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/>
          </svg>
          <span>Catatan Membaca</span>
        </a>

        <a class="nav-item" data-view="progress" onclick="window.app.navigate('progress')">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
            <line x1="18" y1="20" x2="18" y2="10"/>
            <line x1="12" y1="20" x2="12" y2="4"/>
            <line x1="6" y1="20" x2="6" y2="14"/>
          </svg>
          <span>Progress</span>
        </a>

        <a class="nav-item" data-view="refleksi" onclick="window.app.navigate('refleksi')">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
            <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
          </svg>
          <span>Refleksi</span>
        </a>

        <div class="nav-section-title">Fitur Pendukung</div>

        <a class="nav-item" data-view="rak" onclick="window.app.navigate('rak')">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
            <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/>
            <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/>
          </svg>
          <span>Rak Buku Digital</span>
        </a>

        <a class="nav-item" data-view="buddy" onclick="window.app.navigate('buddy')">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
            <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/>
            <circle cx="9" cy="7" r="4"/>
            <path d="M23 21v-2a4 4 0 0 0-3-3.87"/>
            <path d="M16 3.13a4 4 0 0 1 0 7.75"/>
          </svg>
          <span>Book Buddy</span>
        </a>

        <a class="nav-item" data-view="petunjuk" onclick="window.app.navigate('petunjuk')">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
            <circle cx="12" cy="12" r="10"/>
            <path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/>
            <line x1="12" y1="17" x2="12.01" y2="17"/>
          </svg>
          <span>Petunjuk</span>
        </a>

        <a class="nav-item" data-view="privasi" onclick="window.app.navigate('privasi')">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
            <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
            <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
          </svg>
          <span>Privasi & Bantuan</span>
        </a>

        <a class="nav-item" data-view="profil" onclick="window.app.navigate('profil')">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
            <circle cx="12" cy="7" r="4"/>
          </svg>
          <span>Profil Saya</span>
        </a>

        <div style="margin-top: 10px; padding-top: 10px; border-top: 1px dashed #e2e8f0;">
          <a class="nav-item logout-nav-item" onclick="window.app.handleLogout()">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
              <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
              <polyline points="16 17 21 12 16 7"/>
              <line x1="21" y1="12" x2="9" y2="12"/>
            </svg>
            <span>Keluar (Logout)</span>
          </a>
        </div>
      </nav>

      <!-- Sidebar Footer User Card Sesuai Mockup -->
      <div class="sidebar-footer">
        <div class="user-mini-card" onclick="window.app.navigate('profil')">
          <div class="user-avatar" id="sidebar-user-avatar">AP</div>
          <div class="user-details">
            <div class="user-name" id="sidebar-user-name">Andi Pratama</div>
            <div class="user-role" id="sidebar-user-role">XI IPA 1 • SMAN 1</div>
          </div>
        </div>
      </div>
    </aside>

    <!-- Main Content Application -->
    <main class="app-main">
      <!-- Topbar Header Sesuai Mockup Gambar 3.2 -->
      <header class="app-topbar" id="app-topbar">
        <div class="topbar-left">
          <button class="mobile-menu-btn" id="mobile-menu-toggle" aria-label="Toggle Menu">
            ☰
          </button>
          <div class="search-box">
            <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <circle cx="11" cy="11" r="8"/>
              <line x1="21" y1="21" x2="16.65" y2="16.65"/>
            </svg>
            <input
              type="text"
              placeholder="Cari buku, rencana, catatan..."
              onkeydown="window.app.handleGlobalSearch(event)"
            />
          </div>
        </div>

        <div class="topbar-right">
          <!-- Reading Streak Pill Sesuai Mockup -->
          <div class="streak-pill" id="topbar-streak-pill" onclick="window.app.navigate('progress')" title="Reading Streak Aktif">
            🔥 5 Hari Streak
          </div>

          <!-- Notification Bell -->
          <button class="action-icon-btn" onclick="alert('Notifikasi: Jangan lupa mencatat progres membaca hari ini pukul 20:00 WIB!')" title="Notifikasi Pengingat">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/>
              <path d="M13.73 21a2 2 0 0 1-3.46 0"/>
            </svg>
            <span class="notification-badge"></span>
          </button>

          <!-- Quick User Avatar Pill -->
          <div
            id="topbar-user-avatar"
            style="width: 38px; height: 38px; border-radius: 50%; background: #2563eb; color: white; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 0.85rem; cursor: pointer;"
            onclick="window.app.navigate('profil')"
            title="Buka Profil"
          >
            AP
          </div>
        </div>
      </header>

      <!-- Dynamic View Root Content -->
      <section id="view-content-root" class="view-section active">
        <!-- Content injected dynamically by app.bundle.js -->
      </section>
    </main>
  </div>

  <!-- Unified JS Script (Works with both file:/// and http://) -->
  <script src="js/app.bundle.js"></script>
</body>
</html>
